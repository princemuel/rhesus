#:schema https://www.schemastore.org/cargo.json

[workspace]
resolver = "3"
members  = ["crates/rhesus-cli", "crates/rhesus-core"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
repository = "https://github.com/princemuel/rhesus"
license    = "MIT OR Apache-2.0"
publish    = false

[workspace.dependencies]
anyhow = "1"

[workspace.lints.cargo]

[workspace.lints.clippy]
# ── Groups (priority -1 so every individual entry below overrides them) ──────────────
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# ── Pedantic opt-outs: uncomment whichever turn out too noisy ────────────────────────
# cast_possible_truncation = "allow"
# cast_precision_loss      = "allow"
# cast_sign_loss           = "allow"
# doc_markdown             = "allow"
# match_same_arms          = "allow"
# missing_errors_doc       = "allow"
# missing_panics_doc       = "allow"
# must_use_candidate       = "allow"
# return_self_not_must_use = "allow"
# similar_names            = "allow"
# too_many_lines           = "allow"

# ── Nursery (cherry-picked) ──────────────────────────────────────────────────────────
as_ptr_cast_mut                   = "warn"
branches_sharing_code             = "warn"
clear_with_drain                  = "warn"
coerce_container_to_any           = "warn"
collection_is_never_read          = "warn"
debug_assert_with_mut_call        = "warn"
derive_partial_eq_without_eq      = "warn"
doc_link_code                     = "warn"
empty_enums                       = "deny"
equatable_if_let                  = "warn"
fallible_impl_from                = "deny"
future_not_send                   = "warn"
iter_on_empty_collections         = "warn"
iter_on_single_items              = "warn"
iter_with_drain                   = "warn"
missing_const_for_fn              = "warn"
needless_collect                  = "warn"
needless_pass_by_ref_mut          = "warn"
needless_type_cast                = "warn"
non_send_fields_in_send_ty        = "warn"
or_fun_call                       = "warn"
path_buf_push_overwrite           = "warn"
read_zero_byte_vec                = "warn"
redundant_clone                   = "warn"
search_is_some                    = "warn"
set_contains_or_insert            = "warn"
significant_drop_in_scrutinee     = "warn"
single_option_map                 = "warn"
string_lit_as_bytes               = "warn"
too_long_first_doc_paragraph      = "warn"
trailing_empty_array              = "warn"
trait_duplication_in_bounds       = "warn"
transmute_undefined_repr          = "warn"
trivial_regex                     = "warn"
tuple_array_conversions           = "warn"
type_repetition_in_bounds         = "warn"
uninhabited_references            = "deny"
unnecessary_struct_initialization = "warn"
unused_peekable                   = "warn"
unused_rounding                   = "warn"
use_self                          = "warn"
useless_let_if_seq                = "deny"
volatile_composites               = "warn"
while_float                       = "warn"
# Nursery opt-ins (noisy, buggy, or only relevant to some code):
# imprecise_flops                    = "warn"  # float-heavy code
# large_stack_frames                 = "warn"
# literal_string_with_formatting_args = "warn" # false positives
# option_if_let_else                 = "warn"  # divisive style
# significant_drop_tightening        = "warn"  # known false positives
# suboptimal_flops                   = "warn"  # float-heavy code
# suspicious_operation_groupings     = "warn"  # false positives
# redundant_pub_crate: do NOT enable, it contradicts rustc's `unreachable_pub` below.

# ── Restriction (cherry-picked; never enable the whole group) ────────────────────────
alloc_instead_of_core              = "warn"
allow_attributes                   = "warn"
as_pointer_underscore              = "warn"
as_underscore                      = "warn"
cfg_not_test                       = "warn"
clone_on_ref_ptr                   = "warn"
create_dir                         = "warn"
dbg_macro                          = "warn"
decimal_literal_representation     = "warn"
default_union_representation       = "deny"
deprecated_attributes_without_note = "warn"
deref_by_slicing                   = "warn"
else_if_without_else               = "warn"
empty_drop                         = "deny"
empty_enum_variants_with_brackets  = "warn"
empty_structs_with_brackets        = "deny"
error_impl_error                   = "warn"
filetype_is_file                   = "warn"
float_cmp_const                    = "warn"
fn_to_numeric_cast_any             = "deny"
get_unwrap                         = "warn"
if_then_some_else_none             = "warn"
infinite_loop                      = "warn"
iter_over_hash_type                = "warn"
large_include_file                 = "warn"
let_underscore_must_use            = "warn"
lossy_float_literal                = "warn"
map_err_ignore                     = "warn"
mem_forget                         = "warn"
missing_asserts_for_indexing       = "deny"
mixed_read_write_in_expression     = "deny"
multiple_unsafe_ops_per_block      = "warn"
mutex_atomic                       = "warn"
needless_raw_strings               = "warn"
panic_in_result_fn                 = "warn"
pathbuf_init_then_push             = "warn"
pointer_format                     = "warn"
precedence_bits                    = "warn"
rc_buffer                          = "warn"
rc_mutex                           = "warn"
renamed_function_params            = "warn"
rest_pat_in_fully_bound_structs    = "warn"
same_name_method                   = "warn"
string_add                         = "warn"
string_lit_chars_any               = "warn"
string_slice                       = "warn"
suspicious_xor_used_as_pow         = "deny"
tests_outside_test_module          = "warn"
todo                               = "warn"
try_err                            = "deny"
undocumented_unsafe_blocks         = "warn"
unimplemented                      = "deny"
unnecessary_safety_comment         = "deny"
unnecessary_safety_doc             = "deny"
unnecessary_self_imports           = "warn"
unneeded_field_pattern             = "warn"
unused_result_ok                   = "warn"
unused_trait_names                 = "warn"
unwrap_in_result                   = "deny"
unwrap_used                        = "warn"
use_debug                          = "warn"
verbose_file_reads                 = "warn"

# Restriction opt-ins (project-dependent):
# allow_attributes_without_reason = "warn"
# arithmetic_side_effects         = "warn"
# as_conversions                  = "warn"  # overlaps the pedantic cast_* lints
# definition_in_module_root     = "warn"
# expect_used                     = "warn"
# float_arithmetic                = "warn"
# indexing_slicing                = "warn"
# mod_module_files                = "warn"  # pick ONE of mod_module_files / self_named_module_files
# inline_modules                  = "warn"
# inline_trait_bounds             = "warn"
# print_stderr                    = "warn"
# print_stdout                    = "warn"
# rest_pattern_accessible_field   = "warn"
std_instead_of_core = "warn"
# unreachable                     = "warn"
# wildcard_enum_match_arm         = "warn"
# Never combine: implicit_return with needless_return (style); the two *_module_files lints.

[workspace.lints.rust]
# ── Groups ───────────────────────────────────────────────────────────────────────────
future_incompatible                        = { level = "warn", priority = -1 }
nonstandard_style                          = { level = "warn", priority = -1 }
refining_impl_trait                        = { level = "warn", priority = -1 }
rust_2018_idioms                           = { level = "warn", priority = -1 }
unknown_or_malformed_diagnostic_attributes = { level = "warn", priority = -1 }
unused                                     = { level = "warn", priority = -1 }

# ── Individual lints ─────────────────────────────────────────────────────────────────
ambiguous_negative_literals   = "warn"
closure_returning_async_block = "warn"
deref_into_dyn_supertrait     = "warn"
ffi_unwind_calls              = "deny"  # C function unwinds into Rust = instant UB
impl_trait_redundant_captures = "warn"
keyword_idents_2018           = "warn"
keyword_idents_2024           = "deny"
let_underscore_drop           = "warn"
macro_use_extern_crate        = "deny"
meta_variable_misuse          = "deny"
missing_copy_implementations  = "allow"
missing_debug_implementations = "warn"
non_ascii_idents              = "deny"
redundant_imports             = "deny"
redundant_lifetimes           = "deny"
single_use_lifetimes          = "deny"
tail_expr_drop_order          = "warn"
trivial_casts                 = "warn"
trivial_numeric_casts         = "warn"
unit_bindings                 = "deny"
unnameable_types              = "warn"
unreachable_pub               = "warn"
unsafe_attr_outside_unsafe    = "warn"
unsafe_op_in_unsafe_fn        = "warn"
unused_import_braces          = "warn"
unused_lifetimes              = "warn"
unused_macro_rules            = "warn"
unused_qualifications         = "warn"
unused_results                = "warn"
variant_size_differences      = "warn"
# missing_docs              = "warn"  # enable once the public API stabilises
# unsafe_code               = "warn"  # enable/disable per project
# unused_crate_dependencies = "warn"  # per crate; noisy with dev-dependencies

[profile.bench]
inherits = "release"
debug    = "line-tables-only"  # readable profiler output
strip    = false

[profile.dev]
opt-level = 1
debug     = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level     = 3
strip         = "debuginfo"  # keeps function names in backtraces
lto           = true
panic         = "abort"
codegen-units = 1

[profile.dist]
inherits  = "release"
opt-level = "z"
strip     = true
