[package]
name                 = "rhesus-cli"
version.workspace    = true
edition.workspace    = true
repository.workspace = true
license.workspace    = true
publish.workspace    = true

[features]
lexopt = ["dep:lexopt"]

[[bin]]
name = "rhesus"
path = "src/main.rs"

[dependencies]
lexopt    = { version = "0.3", optional = true }
rustyline = "19"

rhesus-core = { path = "../rhesus-core" }

[lints]
workspace = true
